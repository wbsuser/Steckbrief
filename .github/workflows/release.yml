name: Build Android APK and Windows EXE

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release-Tag, zum Beispiel v0.1.0"
        required: true
        type: string
      release_name:
        description: "Anzeigename des Releases"
        required: false
        default: "Mini-Software Release"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android --no-sync

      - name: Sync Android platform
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.cache\\electron-builder
      LOCALAPPDATA: ${{ github.workspace }}\\.localappdata
      NPM_CONFIG_CACHE: ${{ github.workspace }}\\.npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows packages
        run: npm run build:win

      - name: Verify Windows executables
        shell: powershell
        run: |
          $exeFiles = Get-ChildItem -LiteralPath release -Filter *.exe -File -ErrorAction Stop
          if (-not $exeFiles) {
            throw "Es wurden keine EXE-Dateien im release-Ordner gefunden."
          }
          $exeFiles | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe
            release/win-unpacked/**

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-windows
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/windows

      - name: Determine release values
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ inputs.release_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            artifacts/android/app-debug.apk \
            artifacts/windows/*.exe \
            --title "${{ steps.meta.outputs.name }}" \
            --notes "Automatisch gebaut aus dem GitHub-Repository. Android-Datei ist aktuell eine Debug-APK. Windows-Artefakte sind nicht signiert."
